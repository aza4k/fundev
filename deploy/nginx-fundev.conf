# ==========================================
# Nginx configuration for fundev.uz
# Copy to: /etc/nginx/sites-available/fundev.uz
# Symlink: ln -s /etc/nginx/sites-available/fundev.uz /etc/nginx/sites-enabled/
# ==========================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name fundev.uz www.fundev.uz 185.133.49.211 localhost;

    client_max_body_size 50M;

    # Static files served directly by Nginx for speed
    location /static/ {
        alias /var/www/fundev/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Media files (uploaded blog thumbnails, etc.)
    location /media/ {
        alias /var/www/fundev/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Pass all dynamic requests to Gunicorn Unix socket
    location / {
        proxy_pass http://unix:/var/www/fundev/fundev.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
